<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    button {
      padding: 12px 16px;
      font-size: 18px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Telegram Mini App</h1>
  <button onclick="send()">Send Data</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function send() {
      tg.sendData("Hello from GitHub Mini App!");
    }
  </script>
</body>
</html>
